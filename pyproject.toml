[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bci-competition-iv-2a"
version = "0.1.0"
description = "Subject-independent and subject-wise four-class motor-imagery EEG decoding on BCI Competition IV 2a"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mne>=1.6,<2",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "pandas>=2.0",
  "torch>=2.1",
  "tqdm>=4.65",
]

[project.scripts]
bci-2a-run = "bci_2a.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
